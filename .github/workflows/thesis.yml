name: Build thesis PDF

on:
  push:
    branches: [main]
    paths:
      - "text/salasym/**"
  pull_request:
    paths:
      - "text/salasym/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Build thesis
        run: make thesis

      - name: Upload thesis PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: text/salasym/build/salasym.pdf
          if-no-files-found: error
